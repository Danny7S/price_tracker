
{% extends 'base.html' %}

{% block title %}Add Store - Price Tracker{% endblock %}

{% block content %}
    <h1 class="mb-3">Add Store</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Add Store</button>
        <a href="{% url 'store_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}

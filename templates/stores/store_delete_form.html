<!DOCTYPE html>
<html>
<head>
    <title>Delete Store</title>
</head>
<body>
    <h1>Delete Store</h1>

    <p>Are you sure you want to delete "{{ object.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'store_list' %}">Cancel</a>
</body>
</html>

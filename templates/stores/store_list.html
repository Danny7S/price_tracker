
{% extends 'base.html' %}

{% block title %}Stores - Price Tracker{% endblock %}

{% block content %}
    <h1>Stores</h1>

    <a href="{% url 'store_create' %}">Add Store</a>

    <hr>

    {% for store in stores %}
        <div>
            <h2>{{ store.name }}</h2>
            <p>Address: {{ store.address }}</p>
            <p>{{ store.description }}</p>

            <a href="{% url 'store_edit' store.pk %}">Edit</a>
            <a href="{% url 'store_delete' store.pk %}">Delete</a>
        </div>
        <hr>
    {% empty %}
        <p>No stores available.</p>
    {% endfor %}
{% endblock %}

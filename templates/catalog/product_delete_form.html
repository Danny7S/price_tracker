
{% extends 'base.html' %}

{% block title %}Delete Product - Price Tracker{% endblock %}

{% block content %}
    <h1>Delete Product</h1>

    <p>Are you sure you want to delete "{{ object.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'product_list' %}">Cancel</a>
{% endblock %}


{% extends 'base.html' %}

{% block title %}Delete Price - Price Tracker{% endblock %}

{% block content %}
    <h1 class="mb-3">Delete Product Price</h1>

    <p>
        Are you sure you want to delete the price for
        "{{ object.product.name }}" at "{{ object.store.name }}"?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'price_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}

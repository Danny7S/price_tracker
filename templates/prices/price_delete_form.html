
{% extends 'base.html' %}

{% block title %}Delete Price - Price Tracker{% endblock %}

{% block content %}
    <h1>Delete Product Price</h1>

    <p>
        Are you sure you want to delete the price for
        "{{ object.product.name }}" at "{{ object.store.name }}"?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'price_list' %}">Cancel</a>
{% endblock %}

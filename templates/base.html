
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Price Tracker{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header>
    <nav class="navbar navbar-expand bg-dark border-bottom text-white">
        <div class="container">
            <a class="navbar-brand text-white" href="{% url 'home' %}">
                Price Tracker
            </a>

            <div class="navbar-nav">
                <a class="nav-link text-white" href="{% url 'product_list' %}">Products</a>
                <a class="nav-link text-white" href="{% url 'category_list' %}">Categories</a>
                <a class="nav-link text-white" href="{% url 'store_list' %}">Stores</a>
                <a class="nav-link text-white" href="{% url 'price_list' %}">Prices</a>
            </div>
        </div>
    </nav>
</header>

<main class="container my-4">
    {% block content %}
    {% endblock %}
</main>

<footer class="text-center py-3 border-top">
    <p class="mb-0">&copy; 2026 Price Tracker</p>
</footer>

</body>
</html>
